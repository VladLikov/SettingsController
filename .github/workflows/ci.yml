name: iOS package
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.MD', 'Documentation/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '**.MD', 'Documentation/**', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: ios-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Regression / ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            family: iPhone
            runtime: '27.0'
            device: iPhone 18 Pro
          - name: iPad
            family: iPad
            runtime: '27.0'
            device: iPad Pro 11-inch (M5)
          - name: Duo
            family: iPhone
            runtime: '27.1'
            device: iPhone Duo
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      DEVICE_FAMILY: ${{ matrix.family }}
      DEVICE_NAME: ${{ matrix.device }}
      IOS_RUNTIME: ${{ matrix.runtime }}
      RESULT_LABEL: ${{ matrix.name }}
    steps:
      - name: Toolchain evidence
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list runtimes
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Resolved packages and unchanged dependency modules are reused between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .build/xcode/SourcePackages
            .build/xcode/Build/Intermediates.noindex
            .build/xcode/ModuleCache.noindex
          key: package-derived-${{ matrix.name }}-xcode27.1-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: package-derived-${{ matrix.name }}-xcode27.1-
      - name: Validate localization and privacy resources
        run: python3 scripts/validate-resources.py
      - name: Check formatting (swift-format)
        run: xcrun swift format lint --strict --recursive --parallel Sources Tests Examples Package.swift
      - name: Build and test the iOS 15 deployment target
        run: bash scripts/test-ios.sh
      - name: Source and warning evidence
        if: always()
        run: |
          mkdir -p .build/verification
          git archive --format=tar.gz --output=.build/verification/source.tar.gz HEAD
          grep -n 'error:\|warning:\|Executed .* tests' .build/verification/*/test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.name }}
          path: |
            .build/verification/**/*.json
            .build/verification/**/*.txt
            .build/verification/**/*.log
            .build/verification/source.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: result-bundle-${{ matrix.name }}
          path: .build/verification/${{ matrix.name }}/TestResults.xcresult
          retention-days: 3
