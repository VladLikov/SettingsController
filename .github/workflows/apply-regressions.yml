name: Apply and verify regression fixes
on:
  push:
    branches: [codex/settingscontroller-4.0-hardening]
    paths: [.github/workflows/apply-regressions.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/settingscontroller-4.0-hardening
          fetch-depth: 0
      - name: Apply cross-screen ordering fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/implementation/phase4.py
          git config user.name 'SettingsController CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources
          git commit -m 'Protect cross-screen account ordering and bound glyph tint allocations'
          git push origin HEAD:codex/settingscontroller-4.0-hardening
      - name: iPhone regression suite
        run: bash scripts/test-ios.sh
      - name: iPad regression suite
        env:
          DEVICE_FAMILY: iPad
        run: bash scripts/test-ios.sh
      - name: Collect source and evidence
        if: always()
        run: |
          mkdir -p .build/verification
          git archive --format=tar.gz --output=.build/verification/source.tar.gz HEAD
          git diff > .build/verification/uncommitted.patch
          grep -n 'error:\|warning:\|Executed .* tests' .build/verification/*/test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-regressions
          path: |
            .build/verification/**/*.json
            .build/verification/**/*.txt
            .build/verification/**/*.log
            .build/verification/source.tar.gz
            .build/verification/uncommitted.patch
          retention-days: 7
