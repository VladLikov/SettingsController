name: Apply and verify 4.0 implementation
on:
  push:
    branches: [codex/settingscontroller-4.0-hardening]
    paths: [.github/workflows/apply-implementation.yml]
permissions:
  contents: write
jobs:
  implement:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/settingscontroller-4.0-hardening
          fetch-depth: 0
      - name: Apply reviewed changes to the implementation branch
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/implementation/phase{1,2,3}.py; do python3 "$script"; done
          git config user.name 'SettingsController CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources Tests Package.swift
          git commit -m 'Implement cancellation-safe settings, lazy destinations and adaptive UI'
          git push origin HEAD:codex/settingscontroller-4.0-hardening
      - name: Resolve versioned dependencies and commit the lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          xcodebuild -version
          xcrun swift --version
          xcodebuild -resolvePackageDependencies -scheme SettingsController
          if ! git diff --quiet -- Package.resolved; then
            git add Package.resolved
            git commit -m 'Resolve CheckUpdate 1.0.1 and remove unused SwiftBoost pin'
            git push origin HEAD:codex/settingscontroller-4.0-hardening
          fi
      - name: Compile and run the baseline regression suite
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list devices available -j > .build/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json,sys; r="com.apple.CoreSimulator.SimRuntime.iOS-"+sys.argv[1].replace(".","-"); ds=json.load(open(".build/simulators.json"))["devices"].get(r,[]); ds=sorted((d for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")),key=lambda d:d["name"]); assert ds, "Install runtime "+r; print(ds[0]["udid"])' "$SDK_VERSION")
          git rev-parse HEAD | tee .build/tested-sha.txt
          xcodebuild -scheme SettingsController -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath .build/xcode -resultBundlePath .build/TestResults.xcresult -parallel-testing-enabled NO test CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/test.log
      - name: Collect source and test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p .build
          git archive --format=tar.gz --output=.build/source.tar.gz HEAD
          git diff > .build/uncommitted.patch
          if [ -d .build/TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path .build/TestResults.xcresult > .build/test-summary.json || true
            cat .build/test-summary.json
          fi
          grep -n 'error:\|warning:\|Executed .* tests' .build/test.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-implementation-verification
          path: |
            .build/source.tar.gz
            .build/uncommitted.patch
            .build/test.log
            .build/test-summary.json
            .build/tested-sha.txt
            .build/simulators.json
          retention-days: 7
