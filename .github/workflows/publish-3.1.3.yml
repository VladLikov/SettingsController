name: Publish SettingsController 3.1.3

on:
  workflow_run:
    workflows: ["iOS package"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release for verified main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$HEAD_SHA" != "$VERIFIED_SHA" ]; then
            echo "Skipping stale CI run: $VERIFIED_SHA (main is $HEAD_SHA)"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/3.1.3" >/dev/null 2>&1; then
            echo "Release tag 3.1.3 already exists"
            exit 0
          fi
          gh release create 3.1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "3.1.3 — Typed email diagnostics" \
            --notes "Typed SettingsMailInfo with adaptyProfileID, productID, and isPremium, fetched through the optional async settingsMailInfo() provider. Keeps legacy fields and has no Adapty dependency."
