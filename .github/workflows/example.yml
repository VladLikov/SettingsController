name: Public example and UI smoke
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.MD', 'Documentation/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', '**.MD', 'Documentation/**', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: example-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  build:
    name: Build for testing
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Toolchain evidence
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Dependencies and unchanged modules are reused between runs; a fresh checkout still recompiles changed sources.
      - uses: actions/cache@v4
        with:
          path: |
            .build/example-derived/SourcePackages
            .build/example-derived/Build/Intermediates.noindex
            .build/example-derived/ModuleCache.noindex
          key: example-derived-xcode27.1-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Examples/**', 'scripts/generate-example.py') }}
          restore-keys: example-derived-xcode27.1-
      - name: Build once for every simulator
        run: MODE=build bash scripts/test-example.sh
      # A tarball keeps the executable bits that artifact zips drop.
      - name: Pack the built products
        run: tar -czf example-products.tgz -C .build/example-derived/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: example-products
          path: example-products.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-build-log
          path: .build/example-results/build.log
          retention-days: 7
  test:
    name: example (${{ matrix.name }}, ${{ matrix.family }}, ${{ matrix.runtime }}, ${{ matrix.device }})
    needs: build
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            family: iPhone
            runtime: '27.0'
            device: iPhone 18 Pro
          - name: iPad
            family: iPad
            runtime: '27.0'
            device: iPad Pro 11-inch (M5)
          - name: Duo
            family: iPhone
            runtime: '27.1'
            device: iPhone Duo
    env:
      DEVICE_FAMILY: ${{ matrix.family }}
      DEVICE_NAME: ${{ matrix.device }}
      IOS_RUNTIME: ${{ matrix.runtime }}
      RESULT_LABEL: ${{ matrix.name }}
    steps:
      - name: Toolchain evidence
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list runtimes
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A fresh runner's first simulator boot migrates data for minutes; start it while artifacts download.
      - name: Start booting the simulator
        run: MODE=boot bash scripts/test-example.sh
      - uses: actions/download-artifact@v4
        with:
          name: example-products
      - name: Unpack the built products
        run: |
          mkdir -p .build/example-derived/Build
          tar -xzf example-products.tgz -C .build/example-derived/Build
      - name: Test the prebuilt example
        run: MODE=test bash scripts/test-example.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-${{ matrix.name }}
          path: |
            .build/example-results/**/*.json
            .build/example-results/**/*.txt
            .build/example-results/**/*.log
            .build/example-results/**/attachments
          retention-days: 7
