name: Publish SettingsController 3.1.5

on:
  workflow_run:
    workflows: ["iOS package"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Release verified main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" != "$VERIFIED_SHA" ]; then
            echo "Skipping obsolete check: $VERIFIED_SHA; main is $MAIN_SHA"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/3.1.5" >/dev/null 2>&1; then
            echo "Tag 3.1.5 already exists"
            exit 0
          fi
          gh release create 3.1.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "3.1.5 — Russian localization and mail diagnostics" \
            --notes "Removed duplicate Adapty Profile ID from every email, with no fallback into User ID. Added preferred two-field mail info initializer and compatibility shim. Polished Russian localizations. Existing callers remain source-compatible."
